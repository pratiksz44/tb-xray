name: CD

# Runs on every push to main, or manually (e.g. after uploading new model files to Blob Storage).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC sign-in to Azure (no stored credentials)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push and deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.apps.outputs.url }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'tbx' }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Shared infrastructure (idempotent)
        id: infra
        run: |
          az deployment group create -g "$RG" -n "infra-${{ github.run_number }}" \
            -f infra/main.bicep -p namePrefix="$PREFIX" deployApps=false \
            --query properties.outputs -o json > infra.json
          echo "acr=$(jq -r .acrName.value infra.json)" >> "$GITHUB_OUTPUT"
          echo "registry=$(jq -r .acrLoginServer.value infra.json)" >> "$GITHUB_OUTPUT"
          echo "storage=$(jq -r .storageAccountName.value infra.json)" >> "$GITHUB_OUTPUT"

      - name: Download model files (baked into the backend image)
        run: |
          # Blob location comes from backend/config.yaml: https://<account>.blob.core.windows.net/<container>[/<prefix>]
          url=$(yq '.model.blob_url' backend/config.yaml)
          path=${url#https://*/}; path=${path%/}
          account=${url#https://}; account=${account%%.*}
          container=${path%%/*}
          prefix=${path#"$container"}; prefix=${prefix#/}
          model_dir=backend/$(yq '.model.dir' backend/config.yaml)
          az storage blob download-batch --auth-mode login --account-name "$account" \
            --source "$container" --pattern "${prefix:+$prefix/}*" --destination "$RUNNER_TEMP/models"
          cp "$RUNNER_TEMP/models/$prefix"/* "$model_dir"/
          ls -la "$model_dir"

      - name: Registry login
        run: az acr login --name "${{ steps.infra.outputs.acr }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.infra.outputs.registry }}/tb-xray-api:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.infra.outputs.registry }}/tb-xray-web:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy container apps
        id: apps
        run: |
          url=$(az deployment group create -g "$RG" -n "apps-${{ github.run_number }}" \
            -f infra/main.bicep -p namePrefix="$PREFIX" deployApps=true \
            apiImage="${{ steps.infra.outputs.registry }}/tb-xray-api:$TAG" \
            webImage="${{ steps.infra.outputs.registry }}/tb-xray-web:$TAG" \
            --query properties.outputs.webUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test through the public frontend
        env:
          URL: ${{ steps.apps.outputs.url }}
        run: |
          echo "Waiting for $URL (a cold start loads the models)..."
          for _ in $(seq 1 60); do
            curl -fs "$URL/api/health" && break
            sleep 10
          done
          code=$(curl -s -o predict.json -w '%{http_code}' -F "file=@.github/smoke/sample.png" "$URL/api/predict")
          cat predict.json; echo
          test "$code" = "200"
