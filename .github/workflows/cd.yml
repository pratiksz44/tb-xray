name: CD

# On every push to main (or manually): test, build both images, push them to ghcr.io, then
# (re)create the existing Azure Container Instance group with the new images.
#
# GitHub settings needed:
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC sign-in to Azure)
#              GHCR_TOKEN   classic PAT with read:packages, so ACI can pull the private images
#   variables: AZURE_RESOURCE_GROUP, ACI_NAME
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to ghcr.io
  id-token: write # OIDC sign-in to Azure

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACI: ${{ vars.ACI_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "API_IMAGE=ghcr.io/$owner/tb-xray-api:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/$owner/tb-xray-web:$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download model files (baked into the backend image)
        run: |
          url=$(yq '.model.blob_url' backend/config.yaml)   # https://<account>.blob.core.windows.net/<container>
          account=${url#https://}; account=${account%%.*}
          az storage blob download-batch --auth-mode login --account-name "$account" \
            --source "${url##*/}" --destination backend/models
          ls -la backend/models

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to Azure Container Instances
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          location=$(az group show -n "$RG" --query location -o tsv)
          # One container group: nginx (public, port 8080) proxies /api to the backend on localhost:8000.
          cat > aci.yaml <<EOF
          apiVersion: 2021-10-01
          name: $ACI
          location: $location
          type: Microsoft.ContainerInstance/containerGroups
          properties:
            osType: Linux
            restartPolicy: Always
            ipAddress:
              type: Public
              dnsNameLabel: $ACI
              ports: [{ protocol: TCP, port: 8080 }]
            imageRegistryCredentials:
              - { server: ghcr.io, username: $GHCR_USER, password: $GHCR_TOKEN }
            containers:
              - name: api
                properties:
                  image: $API_IMAGE
                  resources: { requests: { cpu: 2, memoryInGB: 4 } }
              - name: web
                properties:
                  image: $WEB_IMAGE
                  resources: { requests: { cpu: 0.5, memoryInGB: 0.5 } }
                  ports: [{ port: 8080 }]
                  environmentVariables:
                    - { name: BACKEND_URL, value: "http://localhost:8000" }
                    - { name: BACKEND_HOST, value: localhost }
          EOF
          # Delete + create: an in-place update can't change the container list or resources.
          az container delete -g "$RG" -n "$ACI" --yes -o none 2>/dev/null || true
          az container create -g "$RG" --file aci.yaml -o none
          echo "URL=http://$(az container show -g "$RG" -n "$ACI" --query ipAddress.fqdn -o tsv):8080" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          echo "Waiting for $URL (the backend loads its models on start)..."
          for _ in $(seq 1 60); do
            curl -fs "$URL/api/health" && break
            sleep 10
          done
          code=$(curl -s -o predict.json -w '%{http_code}' -F "file=@.github/smoke/sample.png" "$URL/api/predict")
          cat predict.json; echo
          test "$code" = "200"
