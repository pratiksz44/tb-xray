name: CD

# On every push to main (or manually): test, build both images, push them to ghcr.io, then
# update the existing Azure Container Instance group in place with the new images.
#
# GitHub settings needed:
#   secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC sign-in to Azure)
#              GHCR_TOKEN   classic PAT with read:packages, so ACI can pull the private images
#              APP_PASSWORD password of the app's single user (username: auth.username in backend/config.yaml)
#   variables: AZURE_RESOURCE_GROUP, ACI_NAME
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to ghcr.io
  id-token: write # OIDC sign-in to Azure

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACI: ${{ vars.ACI_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings + image names
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          : "${RG:?Set the AZURE_RESOURCE_GROUP variable in GitHub}"
          : "${ACI:?Set the ACI_NAME variable in GitHub}"
          : "${GHCR_TOKEN:?Set the GHCR_TOKEN secret in GitHub}"
          : "${APP_PASSWORD:?Set the APP_PASSWORD secret in GitHub}"
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "API_IMAGE=ghcr.io/$owner/tb-xray-api:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/$owner/tb-xray-web:$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download model files (baked into the backend image)
        run: |
          url=$(yq '.model.blob_url' backend/config.yaml)   # https://<account>.blob.core.windows.net/<container>
          account=${url#https://}; account=${account%%.*}
          mkdir -p backend/models   # download-batch needs an existing folder
          az storage blob download-batch --auth-mode login --account-name "$account" \
            --source "${url##*/}" --destination backend/models
          ls -la backend/models

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to Azure Container Instances
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          location=$(az group show -n "$RG" --query location -o tsv)
          # One container group: nginx (public, port 8080) proxies /api to the backend on localhost:8000.
          cat > aci.yaml <<EOF
          apiVersion: 2021-10-01
          name: $ACI
          location: $location
          type: Microsoft.ContainerInstance/containerGroups
          properties:
            osType: Linux
            restartPolicy: Always
            ipAddress:
              type: Public
              dnsNameLabel: $ACI-app   # 5-63 chars, unique per region
              ports: [{ protocol: TCP, port: 8080 }]
            imageRegistryCredentials:
              - { server: ghcr.io, username: $GHCR_USER, password: $GHCR_TOKEN }
            containers:
              - name: api
                properties:
                  image: $API_IMAGE
                  resources: { requests: { cpu: 2, memoryInGB: 4 } }
                  environmentVariables:
                    - { name: APP_PASSWORD, secureValue: $(jq -Rn --arg p "$APP_PASSWORD" '$p') }   # hidden in Azure
              - name: web
                properties:
                  image: $WEB_IMAGE
                  resources: { requests: { cpu: 0.5, memoryInGB: 0.5 } }
                  ports: [{ port: 8080 }]
                  environmentVariables:
                    - { name: BACKEND_URL, value: "http://localhost:8000" }
                    - { name: BACKEND_HOST, value: localhost }
          EOF
          # Updates the existing group in place (new images, containers restarted); creates it if missing.
          # If Azure says a property can't be updated (e.g. CPU/memory or container list changed), delete
          # the group once in the portal and re-run.
          az container create -g "$RG" --file aci.yaml -o none
          echo "URL=http://$(az container show -g "$RG" -n "$ACI" --query ipAddress.fqdn -o tsv):8080" >> "$GITHUB_ENV"

      - name: Smoke test
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          echo "Waiting for $URL (the backend loads its models on start)..."
          for _ in $(seq 1 60); do
            curl -fs "$URL/api/health" && break
            sleep 10
          done
          sample=.github/smoke/sample.png
          echo "Without signing in, predict must be refused:"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F "file=@$sample" "$URL/api/predict")" = "401"
          user=$(yq '.auth.username' backend/config.yaml)
          jq -n --arg u "$user" --arg p "$APP_PASSWORD" '{username: $u, password: $p}' |
            curl -fs -c cookies.txt -H "Content-Type: application/json" -d @- "$URL/api/login" > /dev/null
          code=$(curl -s -b cookies.txt -o predict.json -w '%{http_code}' -F "file=@$sample" "$URL/api/predict")
          cat predict.json; echo
          test "$code" = "200"
