# Local stack: backend + nginx frontend.  Put the model files in backend/models/ first.
#   APP_PASSWORD=<password> docker compose up --build      ->  http://localhost:8080  (user: pratik)
name: tb-xray

services:
  backend:
    build: ./backend
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD to the login password}

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_HOST: backend
    ports: ["8080:8080"]
    depends_on: [backend]
