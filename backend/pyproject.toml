[project]
name = "tb-xray"
version = "1.0.0"
description = "TB chest X-ray screening API: chest X-ray check + 5-fold InceptionV3 ensemble"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.46.0",
  "python-multipart>=0.0.32",
  "numpy>=2.4.4",
  "opencv-python-headless>=4.13.0.92",
  "pyyaml>=6.0.3",
  # tensorflow/keras must be the same as or NEWER than the versions used for training on Kaggle.
  "tensorflow-cpu>=2.21.0; sys_platform == 'linux'",
  "tensorflow>=2.21.0; sys_platform != 'linux'",
  "keras>=3.15.1",
  "torch>=2.14.0",
  "torchvision>=0.29.0",
  "torchxrayvision>=1.5.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1", "ruff>=0.16.9"]

[tool.uv]
package = false

# CPU-only PyTorch wheels (far smaller than the CUDA ones)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
